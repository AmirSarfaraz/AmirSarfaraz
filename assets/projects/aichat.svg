<svg xmlns="http://www.w3.org/2000/svg" width="420" height="164" viewBox="0 0 420 164" role="img" aria-label="AIChatPlatform: LLM chat platform with streaming replies, Google/GitHub sign-in and a credit system">
  <style>@font-face{font-family:GeistMono;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GeistMono;font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
  .fade{animation:fade .5s ease-out both}
  .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  .type{animation:type .9s steps(40,end) both}
  .cursor{animation:blink 1s steps(1,end) infinite}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
  <defs><clipPath id="c"><rect x=".5" y=".5" width="419" height="163" rx="12"/></clipPath></defs>
  <g class="rise" style="animation-delay:0.74s">
    <g clip-path="url(#c)">
      <rect width="420" height="164" fill="#0b0b0c"/>
      <rect width="420" height="30" fill="#17171a"/>
      <line x1="0" y1="30" x2="420" y2="30" stroke="#2a2a2f"/>
    </g>
    <rect x=".5" y=".5" width="419" height="163" rx="12" fill="none" stroke="#2a2a2f"/>
    <circle cx="16" cy="15" r="4.5" fill="#ff4d2e"/><circle cx="30" cy="15" r="4.5" fill="#3a3a3f"/><circle cx="44" cy="15" r="4.5" fill="#3a3a3f"/>
    <text x="60" y="19" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b8a85">~/projects/aichat</text>
    <g>
      <rect x="309.4" y="7" width="98.6" height="16" rx="8" fill="none" stroke="#2a2a2f"/>
      <circle cx="319.4" cy="15" r="3" fill="#8b8a85"></circle>
      <text x="327.4" y="19" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b8a85">in progress</text>
    </g>
    <text x="18" y="62" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="600" fill="#efede8">AIChatPlatform</text>
    <text x="402" y="62" text-anchor="end" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#55544f">↗</text>
    <text x="18" y="86" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#c9c7c1">LLM chat platform with streaming replies,</text><text x="18" y="104" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#c9c7c1">Google/GitHub sign-in and a credit system</text>
    <rect x="18" y="126" width="95.2" height="22" rx="5" fill="#141416" stroke="#2a2a2f"/><text x="26" y="141" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9c7c1">ASP.NET Core</text><rect x="119.2" y="126" width="62.199999999999996" height="22" rx="5" fill="#141416" stroke="#2a2a2f"/><text x="127.2" y="141" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9c7c1">SignalR</text><rect x="187.39999999999998" y="126" width="49" height="22" rx="5" fill="#141416" stroke="#2a2a2f"/><text x="195.39999999999998" y="141" font-family="GeistMono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#c9c7c1">React</text>
  </g>
</svg>