name: profile art

# Manual for now: GitHub Actions is not available on this account yet.
# When it is, add a schedule (for example `- cron: "17 2 * * 1"`) to refresh the Galaga board weekly.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: build SVGs
        run: node scripts/build.mjs
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile art" && git push)
